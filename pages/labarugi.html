<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PantauCuan — Laba Rugi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 14 Q3 4 9 4 Q15 4 15 9 Q15 12 12 12 L9 12" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
          <circle cx="12" cy="5.5" r="2" fill="#F5A623"/>
        </svg>
      </div>
      <span class="logo-text">Pantau<span>Cuan</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="../index.html" class="nav-item"><span class="nav-icon">▦</span> Dashboard</a>
      <a href="produk.html" class="nav-item"><span class="nav-icon">🍽️</span> Produk</a>
      <a href="pengadaan.html" class="nav-item"><span class="nav-icon">📦</span> Pengadaan</a>
      <a href="cashflow.html" class="nav-item"><span class="nav-icon">💸</span> Cashflow</a>
      <a href="labarugi.html" class="nav-item active"><span class="nav-icon">📊</span> Laba Rugi</a>
      <a href="kasir.html" class="nav-item"><span class="nav-icon">🧾</span> Kasir</a>
      <a href="stok.html" class="nav-item"><span class="nav-icon">🗂️</span> Stok</a>
    </nav>
    <div class="sidebar-footer">
      <div class="cafe-name" id="sidebar-cafe-name">☕ Memuat...</div>
      <div class="cafe-sub">Periode: <span id="periode"></span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title">Laba Rugi <span class="amber-dot"></span></h1>
        <p class="page-sub">Ringkasan keuangan lengkap — bukan sekadar omzet.</p>
      </div>
      <div class="topbar-right">
        <select id="pilih-bulan" onchange="loadLabaRugi()"
          style="background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius-sm);color:var(--text-1);padding:8px 14px;font-size:13px;font-family:'Inter',sans-serif;outline:none;cursor:pointer;box-shadow:var(--shadow)">
        </select>
      </div>
    </header>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:16px">
      <!-- P&L CARD -->
      <div class="table-card" id="pl-card">
        <div class="table-header"><h3 id="pl-judul">Laporan</h3></div>
        <p style="color:var(--text-3);font-size:13px;padding:20px 0">Memuat data...</p>
      </div>

      <!-- CHARTS -->
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="chart-card">
          <div class="chart-header"><h3>Komposisi Biaya</h3></div>
          <canvas id="biayaChart" style="max-height:200px"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-header"><h3>Tren Laba Bersih (6 Bulan)</h3></div>
          <canvas id="labaChart" style="max-height:160px"></canvas>
        </div>
      </div>
    </div>
  </main>

  <style>
    .pl-section { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .pl-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .pl-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em;
      color: var(--text-3); text-transform: uppercase; margin-bottom: 12px;
    }
    .pl-row {
      display: flex; justify-content: space-between;
      font-size: 13.5px; color: var(--text-2); margin-bottom: 8px;
      align-items: center;
    }
    .pl-row.pl-subtotal {
      font-weight: 600; color: var(--text-1);
      margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed var(--border);
    }
    .pl-row.gross-val {
      font-size: 17px; font-weight: 700;
      color: var(--green); font-family: 'Inter', sans-serif;
      margin-top: 4px;
    }
    .pl-margin {
      font-size: 12px; color: var(--text-3); margin-top: 6px;
    }
    .pl-margin strong { color: var(--text-2); }
    .pl-section.net {
      background: var(--accent-dim);
      border-radius: var(--radius-sm);
      padding: 18px;
      border: 1px solid rgba(74,124,89,0.2) !important;
      margin-bottom: 0;
    }
    .pl-row.net-val {
      font-size: 20px; font-weight: 800;
      color: var(--accent); font-family: 'Inter', sans-serif;
      letter-spacing: -0.03em;
    }
    .pl-row.net-val.rugi { color: var(--red); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    Chart.defaults.color = '#8A8A82';
    Chart.defaults.borderColor = 'rgba(0,0,0,0.05)';
    Chart.defaults.font.family = 'Inter';

    let biayaChart = null, labaChart = null;

    function formatRp(n) { return 'Rp ' + (n||0).toLocaleString('id-ID'); }
    function pct(a, b)   { return b === 0 ? '0%' : (a/b*100).toFixed(1) + '%'; }

    // Nama cafe
    (async () => {
      const { data } = await db.from('cafe').select('nama').limit(1).single();
      if (data?.nama) document.getElementById('sidebar-cafe-name').textContent = '☕ ' + data.nama;
    })();

    // Populate pilih bulan
    function initBulanSelect() {
      const sel = document.getElementById('pilih-bulan');
      const now = new Date();
      for (let i = 0; i < 6; i++) {
        const d   = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const val = d.toISOString().slice(0, 7);
        const opt = document.createElement('option');
        opt.value       = val;
        opt.textContent = d.toLocaleDateString('id-ID', {month:'long', year:'numeric'});
        if (i === 0) opt.selected = true;
        sel.appendChild(opt);
      }
      document.getElementById('periode').textContent =
        now.toLocaleDateString('id-ID', {month:'long', year:'numeric'});
    }

    async function loadLabaRugi() {
      const cafeId = await getCafeId();
      const bulan  = document.getElementById('pilih-bulan').value;
      const [year, month] = bulan.split('-');
      const firstDay = `${year}-${month}-01`;
      const lastDay  = new Date(parseInt(year), parseInt(month), 0).toISOString().split('T')[0];

      const { data } = await db.from('cashflow').select('*')
        .eq('cafe_id', cafeId).gte('tanggal', firstDay).lte('tanggal', lastDay);

      // Group by kategori
      const byKat = {};
      (data||[]).forEach(r => {
        if (!byKat[r.kategori]) byKat[r.kategori] = { masuk: 0, keluar: 0 };
        if (r.jenis === 'pemasukan') byKat[r.kategori].masuk += r.nominal;
        else byKat[r.kategori].keluar += r.nominal;
      });

      const totalPendapatan = (data||[]).filter(r => r.jenis === 'pemasukan').reduce((s,r) => s+r.nominal, 0);
      const hpp        = (byKat['Bahan Baku']?.keluar||0) + (byKat['Packaging']?.keluar||0);
      const labaKotor  = totalPendapatan - hpp;
      const biayaGaji  = byKat['Gaji']?.keluar || 0;
      const biayaOps   = byKat['Operasional']?.keluar || 0;
      const biayaLain  = byKat['Lainnya']?.keluar || 0;
      const totalOps   = biayaGaji + biayaOps + biayaLain;
      const labaBersih = labaKotor - totalOps;
      const isRugi     = labaBersih < 0;

      const labelBulan = new Date(firstDay + 'T00:00:00').toLocaleDateString('id-ID', {month:'long', year:'numeric'});

      document.getElementById('pl-card').innerHTML = `
        <div class="table-header" style="margin-bottom:20px">
          <h3>${labelBulan}</h3>
          <span style="font-size:12px;color:var(--text-3);font-weight:500">Net Margin: <strong style="color:${isRugi?'var(--red)':'var(--accent)'}">${pct(labaBersih,totalPendapatan)}</strong></span>
        </div>

        <div class="pl-section">
          <div class="pl-label">📈 Pendapatan</div>
          <div class="pl-row"><span>Penjualan Produk</span><span class="val-green">${formatRp(totalPendapatan)}</span></div>
          <div class="pl-row pl-subtotal"><span>Total Pendapatan</span><span class="val-green">${formatRp(totalPendapatan)}</span></div>
        </div>

        <div class="pl-section">
          <div class="pl-label">📦 Harga Pokok Produksi (HPP)</div>
          <div class="pl-row"><span>Bahan Baku</span><span class="val-red">(${formatRp(byKat['Bahan Baku']?.keluar||0)})</span></div>
          <div class="pl-row pl-subtotal"><span>Total HPP</span><span class="val-red">(${formatRp(hpp)})</span></div>
        </div>

        <div class="pl-section">
          <div class="pl-label">💰 Laba Kotor</div>
          <div class="pl-row gross-val"><span>Pendapatan − HPP</span><span>${formatRp(labaKotor)}</span></div>
          <div class="pl-margin">Gross Margin: <strong>${pct(labaKotor, totalPendapatan)}</strong></div>
        </div>

        <div class="pl-section">
          <div class="pl-label">🏢 Biaya Operasional</div>
          <div class="pl-row"><span>Gaji Karyawan</span><span class="val-red">(${formatRp(biayaGaji)})</span></div>
          <div class="pl-row"><span>Listrik, Sewa & Operasional</span><span class="val-red">(${formatRp(biayaOps)})</span></div>
          <div class="pl-row"><span>Lainnya</span><span class="val-red">(${formatRp(biayaLain)})</span></div>
          <div class="pl-row pl-subtotal"><span>Total Operasional</span><span class="val-red">(${formatRp(totalOps)})</span></div>
        </div>

        <div class="pl-section net">
          <div class="pl-label" style="color:var(--accent);opacity:0.8">${isRugi ? '⚠️ Hasil Akhir' : '🎯 Hasil Akhir'}</div>
          <div class="pl-row net-val ${isRugi ? 'rugi' : ''}">
            <span>${isRugi ? 'Rugi Bersih' : 'Laba Bersih'}</span>
            <span>${formatRp(Math.abs(labaBersih))}</span>
          </div>
          <div class="pl-margin">Net Margin: <strong style="color:${isRugi?'var(--red)':'var(--accent)'}">${pct(labaBersih, totalPendapatan)}</strong></div>
        </div>`;

      // Biaya doughnut chart
      if (biayaChart) biayaChart.destroy();
      biayaChart = new Chart(document.getElementById('biayaChart'), {
        type: 'doughnut',
        data: {
          labels: ['Bahan Baku', 'Gaji', 'Operasional', 'Lainnya'],
          datasets: [{
            data: [byKat['Bahan Baku']?.keluar||0, biayaGaji, biayaOps, biayaLain],
            backgroundColor: ['#4A7C59', '#F5A623', '#6fa884', '#d4891a'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { padding: 12, font: { size: 11, family: 'Inter' }, boxWidth: 8 } } },
          cutout: '65%'
        }
      });

      await loadTrenLaba(cafeId);
    }

    async function loadTrenLaba(cafeId) {
      const now = new Date();
      const labels = [], labaArr = [];

      // Ambil semua data 6 bulan sekaligus — lebih efisien
      const start6 = new Date(now.getFullYear(), now.getMonth() - 5, 1).toISOString().split('T')[0];
      const end6   = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
      const { data: allData } = await db.from('cashflow')
        .select('jenis,nominal,tanggal').eq('cafe_id', cafeId)
        .gte('tanggal', start6).lte('tanggal', end6);

      for (let i = 5; i >= 0; i--) {
        const d        = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const firstDay = d.toISOString().split('T')[0];
        const lastDay  = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().split('T')[0];
        const monthData = allData?.filter(r => r.tanggal >= firstDay && r.tanggal <= lastDay) || [];
        const masuk  = monthData.filter(r => r.jenis === 'pemasukan').reduce((s,r) => s+r.nominal, 0);
        const keluar = monthData.filter(r => r.jenis === 'pengeluaran').reduce((s,r) => s+r.nominal, 0);
        labels.push(d.toLocaleDateString('id-ID', {month:'short'}));
        labaArr.push(masuk - keluar);
      }

      if (labaChart) labaChart.destroy();
      labaChart = new Chart(document.getElementById('labaChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: labaArr,
            backgroundColor: labaArr.map(v => v >= 0 ? 'rgba(74,124,89,0.25)' : 'rgba(192,57,43,0.2)'),
            borderColor:     labaArr.map(v => v >= 0 ? '#4A7C59' : '#c0392b'),
            borderWidth: 2, borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { callback: v => 'Rp ' + (v/1000000).toFixed(0) + 'jt' } }
          }
        }
      });
    }

    initBulanSelect();
    loadLabaRugi();
  </script>
</body>
</html>
